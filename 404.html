<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mengarahkan...</title>
  </head>

  <body>
    <script>
      const repoName = "Latihan-SPS134-Day-21";

      const pathParts = window.location.pathname
        .split("/")
        .filter(Boolean);

      const repoIndex = pathParts.indexOf(repoName);

      if (repoIndex !== -1) {
        const slug = pathParts[repoIndex + 1];

        if (slug) {
          sessionStorage.setItem(
            "requestedDatasetSlug",
            slug,
          );
        }
      }

      window.location.replace(
        `/${repoName}/`,
      );
    </script>
  </body>
</html>
